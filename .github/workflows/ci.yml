name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      # Package code must be clean; scripts/ still has legacy debt tracked separately
      - run: uv run ruff check tracera tests
      - run: uv run ruff check scripts/verify_all_commands.py scripts/test_mcp_e2e.py
      - run: uv run ruff format --check tracera tests

  typecheck:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: uv run mypy tracera

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_mcp.py --ignore=tests/test_mcp_server.py
      - name: MCP tests
        run: uv run pytest tests/test_mcp.py tests/test_mcp_server.py -q

  e2e-mcp:
    name: MCP stdio end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: initialize → list_tools → call_tool against a real server process
        run: uv run python scripts/test_mcp_e2e.py

  build:
    name: Package (uv build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - name: Wheel must contain only tracera/ + metadata
        run: |
          python3 - <<'EOF'
          import zipfile, glob
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"
          names = zipfile.ZipFile(wheels[0]).namelist()
          junk = [n for n in names if "__pycache__" in n or n.startswith(("docs-site", ".next", ".tracera", ".venv"))]
          assert not junk, f"junk in wheel: {junk[:5]}"
          roots = {n.split("/")[0] for n in names}
          assert roots == {"tracera", "tracera-0.1.0.dist-info"} or any(r.endswith("dist-info") for r in roots), roots
          print(f"wheel OK: {len(names)} entries, roots={sorted(roots)}")
          EOF
      - name: Install wheel in a fresh venv and smoke it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/tracera --version
          /tmp/smoke/bin/tracera mcp serve --check | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: uv tool run pip-audit --strict

  docker:
    name: Docker build + MCP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tracera:ci .
      - name: stdio MCP responds over the container boundary
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"probe","version":"0"}}}' \
            | docker run -i tracera:ci | head -c 200
          echo ""
