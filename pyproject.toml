[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracera"
version = "0.1.0"
description = "CodePilotX — Agentic Code Intelligence & Autonomous Coding Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ai", "agent", "code-intelligence", "llm", "rag", "tui"]
authors = [{ name = "TRACERA Team" }]

dependencies = [
    # CLI & TUI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.75.0",
    # Config & Env
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # LLM Providers
    "openai>=1.35.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    # Git
    "gitpython>=3.1.43",
    # Async / IO
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
    # Utilities
    "click>=8.1.7",
    "platformdirs>=4.2.2",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "pathspec>=0.12.0",
    "lancedb>=0.11.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "packaging>=24.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-aiofiles>=23.2.0",
]

[project.scripts]
tracera = "tracera.main:app"

[tool.hatch.build.targets.wheel]
packages = ["tracera"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]