[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracera"
version = "0.1.0"
description = "CodePilotX — Agentic Code Intelligence & Autonomous Coding Engine"
readme = "README.md"
homepage = "https://github.com/tracera/tracera"
documentation = "https://tracera.dev"
repository = "https://github.com/tracera/tracera"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["ai", "agent", "code-intelligence", "llm", "rag", "tui"]
authors = [{ name = "TRACERA Team" }]

dependencies = [
    # CLI & TUI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.75.0",
    # Config & Env
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # LLM Providers
    "openai>=1.35.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    # Git
    "gitpython>=3.1.43",
    # Async / IO
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
    # Utilities
    "click>=8.1.7",
    "platformdirs>=4.2.2",
    # tree-sitter runtime must stay ABI-compatible with the language wheels
    # below: 0.26.x crashes (access violation / corrupt node points) during
    # symbol extraction on Windows. 0.25.x is verified stable.
    "tree-sitter>=0.25.0,<0.26",
    "tree-sitter-python>=0.23.0,<0.26",
    "tree-sitter-javascript>=0.23.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.26",
    "pathspec>=0.12.0",
    "lancedb>=0.11.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "packaging>=24.0",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-aiofiles>=23.2.0",
]

[project.scripts]
tracera = "tracera.main:app"

[tool.hatch.build.targets.wheel]
packages = ["tracera"]

# Ship source + essential metadata, never build artifacts, caches or venvs.
# Without this hatchling walks the whole repo (docs-site/.next broke `uv build`).
[tool.hatch.build.targets.sdist]
include = [
    "/tracera",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/tracera/__pycache__",
    "**/__pycache__",
    "/.tracera",
    "/.venv",
    "/.next",
    "/dist",
]

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "/.tracera",
    "/.venv",
    "/docs-site",
    "/dist",
    "/.pytest_cache",
    "/.ruff_cache",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PT"]
# E501 long lines (legacy), B008 typer function-defaults (idiomatic here)
ignore = ["E501", "B008"]

# Legacy debt, tracked to tighten later (CI gates on everything else):
# PT018 composite assertions, B904 raise-from, E701 multi-statement lines,
# F841 unused vars, UP042 str-enum, B007 unused loop vars
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018", "F841", "E702"]
"tracera/**" = [
    "B904", "E701", "F841", "UP042", "B007", "E722", "E702", "B905",
    "W293", "F401", "E402", "C408", "C401", "E741", "F722", "E731",
    "UP031", "F811",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]